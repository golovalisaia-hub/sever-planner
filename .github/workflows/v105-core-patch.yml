name: v105 one-shot core patch

on:
  push:
    branches:
      - perf/task-responsiveness-v105
    paths:
      - .github/workflows/v105-core-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/task-responsiveness-v105
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch task-scoped rendering
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'app.js';
          let source = fs.readFileSync(path, 'utf8');
          const replacements = [
            [
              "function saveAndRender(){save();render()}",
              "function saveAndRender(collections=['tasks']){save();renderChangedCollections(collections)}"
            ],
            [
              "state.tasks.push(task);rememberTask(task.title);save();$('#quickInput').value='';render();toast('Добавлено')",
              "state.tasks.push(task);rememberTask(task.title);save();$('#quickInput').value='';renderChangedCollections(['tasks']);toast('Добавлено')"
            ],
            [
              "rememberTask(data.title);save();const conflict=window.SeverUiState?.consumeConflict('taskDialog');$('#taskDialog').close();render();toast(",
              "rememberTask(data.title);save();const conflict=window.SeverUiState?.consumeConflict('taskDialog');$('#taskDialog').close();renderChangedCollections(['tasks']);toast("
            ],
            [
              "state.tasks.push(task);rememberTask(task.title);save();render();$('#quickAddDialog').close();toast('Задача добавлена')",
              "state.tasks.push(task);rememberTask(task.title);save();renderChangedCollections(['tasks']);$('#quickAddDialog').close();toast('Задача добавлена')"
            ],
            [
              "saveAndRender();toast(timerCompleted?`${timerMinutes} минут завершено · задача выполнена`:'Задача выполнена'",
              "saveAndRender(timerCompleted?['tasks','focusSessions']:['tasks']);toast(timerCompleted?`${timerMinutes} минут завершено · задача выполнена`:'Задача выполнена'"
            ],
            [
              "else{save();render();renderTimer();toast('Фокус-сессия завершена')}",
              "else{save();renderChangedCollections(['focusSessions']);renderTimer();toast('Фокус-сессия завершена')}"
            ]
          ];

          for (const [before, after] of replacements) {
            const count = source.split(before).length - 1;
            if (count !== 1) {
              throw new Error(`Expected exactly one match, found ${count}: ${before.slice(0, 100)}`);
            }
            source = source.replace(before, after);
          }

          if (!source.includes("function saveAndRender(collections=['tasks']){save();renderChangedCollections(collections)}")) throw new Error('task-scoped saveAndRender missing');
          if (source.includes("function saveAndRender(){save();render()}")) throw new Error('legacy full-render helper survived');
          fs.writeFileSync(path, source);
          NODE
          node --check app.js
      - name: Remove one-shot workflow and commit patch
        run: |
          rm .github/workflows/v105-core-patch.yml
          git config user.name "SEVER CI"
          git config user.email "actions@users.noreply.github.com"
          git add app.js .github/workflows/v105-core-patch.yml
          git diff --cached --check
          git commit -m "perf(v105): scope task mutations to task renders"
          git push origin HEAD:perf/task-responsiveness-v105
