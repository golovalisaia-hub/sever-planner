name: Security and regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install browser test dependencies
        run: pnpm install --frozen-lockfile
      - name: Planner, cloud, AI and ownership regression
        run: node --test tests/*.test.mjs
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Money lifecycle probe (phone 360)
        run: pnpm exec playwright test tests/browser/usability-v84.spec.cjs --project=phone-360 --workers=1 -g "editing a Money plan keeps completed payment history"
      - name: Browser E2E (phones and desktop)
        run: pnpm exec playwright test
      - name: Real user cloud marathon (phone)
        env:
          SEVER_AUTH_TEST_URL: ${{ secrets.SEVER_AUTH_TEST_URL }}
          SEVER_AUTH_TEST_ANON_KEY: ${{ secrets.SEVER_AUTH_TEST_ANON_KEY }}
          SEVER_AUTH_TEST_EMAIL: ${{ secrets.SEVER_AUTH_TEST_EMAIL }}
          SEVER_AUTH_TEST_PASSWORD: ${{ secrets.SEVER_AUTH_TEST_PASSWORD }}
        run: pnpm exec playwright test tests/browser/real-user-cloud-marathon.spec.cjs --project=phone-390 --workers=1
      - name: Real user cloud marathon (desktop)
        env:
          SEVER_AUTH_TEST_URL: ${{ secrets.SEVER_AUTH_TEST_URL }}
          SEVER_AUTH_TEST_ANON_KEY: ${{ secrets.SEVER_AUTH_TEST_ANON_KEY }}
          SEVER_AUTH_TEST_EMAIL: ${{ secrets.SEVER_AUTH_TEST_EMAIL }}
          SEVER_AUTH_TEST_PASSWORD: ${{ secrets.SEVER_AUTH_TEST_PASSWORD }}
        run: pnpm exec playwright test tests/browser/real-user-cloud-marathon.spec.cjs --project=desktop --workers=1
      - name: Upload SEVER 2 visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sever2-visual-review
          path: test-results/sever2-visual
          if-no-files-found: ignore
          retention-days: 3
      - name: Concurrent sync (isolated PostgreSQL and desktop/mobile contexts)
        run: |
          set -euo pipefail
          # PGlite validates the portable planner/sync schema only. Supabase-only
          # push/Vault/pg_cron migrations are covered by dedicated reminder and
          # production security checks and cannot be loaded by PGlite.
          temp_dir="$(mktemp -d)"
          restore_migrations() {
            shopt -s nullglob
            files=("$temp_dir"/*.sql)
            if ((${#files[@]})); then mv "${files[@]}" supabase/migrations/; fi
            rmdir "$temp_dir" 2>/dev/null || true
          }
          trap restore_migrations EXIT
          for file in supabase/migrations/*.sql; do
            case "$(basename "$file")" in
              001_*|002_*|003_*|004_*|005_*|006_*) ;;
              *) mv "$file" "$temp_dir"/ ;;
            esac
          done
          node tests/browser/concurrent-db.cjs
          restore_migrations
          trap - EXIT
      - name: Static regression
        run: node tests/qa_static.mjs
      - name: Sync regression
        run: node tests/sync_core.mjs
      - name: Draft and Undo regressions
        run: |
          node tests/cloud-draft-regression.test.mjs
          node tests/entity-undo-regression.test.mjs
      - name: Security suite
        env:
          SEVER_RLS_TEST_URL: ${{ secrets.SEVER_RLS_TEST_URL }}
          SEVER_RLS_TEST_ANON_KEY: ${{ secrets.SEVER_RLS_TEST_ANON_KEY }}
          SEVER_RLS_USER_A_EMAIL: ${{ secrets.SEVER_RLS_USER_A_EMAIL }}
          SEVER_RLS_USER_A_PASSWORD: ${{ secrets.SEVER_RLS_USER_A_PASSWORD }}
          SEVER_RLS_USER_B_EMAIL: ${{ secrets.SEVER_RLS_USER_B_EMAIL }}
          SEVER_RLS_USER_B_PASSWORD: ${{ secrets.SEVER_RLS_USER_B_PASSWORD }}
          SEVER_AUTH_TEST_URL: ${{ secrets.SEVER_AUTH_TEST_URL }}
          SEVER_AUTH_TEST_ANON_KEY: ${{ secrets.SEVER_AUTH_TEST_ANON_KEY }}
          SEVER_AUTH_TEST_EMAIL: ${{ secrets.SEVER_AUTH_TEST_EMAIL }}
          SEVER_AUTH_TEST_PASSWORD: ${{ secrets.SEVER_AUTH_TEST_PASSWORD }}
        run: node --test tests/security/*.*
      - name: Secret scan
        shell: bash
        run: |
          if git grep -IEni '(sb_secret_[A-Za-z0-9._-]{10,}|service[_-]?role([_-]?key)?[[:space:]]*[:=][[:space:]]*[A-Za-z0-9._-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|postgres(ql)?://[^[:space:]]+:[^[:space:]@]+@)' -- ':!tests/security/*' ':!.github/workflows/security.yml'; then
            echo 'Potential secret detected'; exit 1
          fi
      - name: Backend tests
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pytest backend/tests