name: v105 one-shot static contract bump

on:
  push:
    paths:
      - .github/workflows/v105-static-contract-bump.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/task-responsiveness-v105
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update static app asset contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'tests/qa_static.mjs';
          let source = fs.readFileSync(file, 'utf8');
          const from = "['app.js', 51]";
          const count = source.split(from).length - 1;
          if (count !== 1) throw new Error(`expected exactly one static app version contract, got ${count}`);
          source = source.replace(from, "['app.js', 105]");
          fs.writeFileSync(file, source);
          NODE
          node tests/qa_static.mjs
      - name: Guard active static app version contract
        run: |
          if git grep -n -F "['app.js', 51]" -- tests/qa_static.mjs; then
            echo 'Stale active qa_static app version remains'; exit 1
          fi
          git grep -n -F "['app.js', 105]" -- tests/qa_static.mjs
      - name: Remove one-shot workflow and commit test contract
        run: |
          rm .github/workflows/v105-static-contract-bump.yml
          git config user.name "SEVER CI"
          git config user.email "actions@users.noreply.github.com"
          git add tests/qa_static.mjs .github/workflows/v105-static-contract-bump.yml
          git diff --cached --check
          git commit -m "test(v105): align static planner core version"
          git push origin HEAD:perf/task-responsiveness-v105
