name: Release v55 cache boundary normalization
on:
  push:
    branches:
      - release/sever-2-v55
permissions:
  contents: write
jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[v55-cache-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/sever-2-v55
      - name: Bump cloud runtime cache boundary and static contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          s = index.read_text()
          old = 'js/cloud-runtime.js?v=47'
          if old not in s:
              raise SystemExit('Expected v47 cloud runtime reference missing from index.html')
          s = s.replace(old, 'js/cloud-runtime.js?v=55')
          index.write_text(s)

          qa = Path('tests/qa_static.mjs')
          q = qa.read_text()
          old_pair = "['js/cloud-runtime.js', 47]"
          old_regex = r"/js\/cloud-runtime\.js\?v=47/"
          if old_pair not in q:
              raise SystemExit('Expected v47 asset-version contract missing')
          if old_regex not in q:
              raise SystemExit('Expected v47 cloud-runtime regex missing')
          q = q.replace(old_pair, "['js/cloud-runtime.js', 55]")
          q = q.replace(old_regex, r"/js\/cloud-runtime\.js\?v=55/")
          q = q.replace('Asset versions include the v51 stability cache boundary', 'Asset versions include the v55 field-sync cache boundary')
          qa.write_text(q)
          PY
          git diff --check
          git diff -- index.html tests/qa_static.mjs
      - name: Commit v55 cache boundary
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html tests/qa_static.mjs
          git commit -m "release: bump cloud runtime cache boundary to v55 [v55-cache-fixed]"
          git push origin HEAD:release/sever-2-v55
