name: Release v55 static cache-name normalization
on:
  push:
    branches:
      - release/sever-2-v55
permissions:
  contents: write
jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[v55-cache-name-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/sever-2-v55
      - name: Align static cache-name contract with v55
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/qa_static.mjs')
          s = p.read_text()
          old = 'assert.match(sw, /sever-v52-ui-stabilization/);'
          new = 'assert.match(sw, /sever-v55-field-sync/);'
          if old not in s:
              raise SystemExit('Expected old cache-name assertion missing')
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one old cache-name assertion, found {s.count(old)}')
          s = s.replace(old, new)
          if old in s:
              raise SystemExit('Old cache-name assertion remains')
          p.write_text(s)
          PY
          git diff --check
          git diff -- tests/qa_static.mjs
      - name: Commit static cache-name contract
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/qa_static.mjs
          git commit -m "test: align static cache name with v55 [v55-cache-name-fixed]"
          git push origin HEAD:release/sever-2-v55
