name: v106 one-shot regression diagnostic

on:
  push:
    paths:
      - .github/workflows/v106-regression-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/missed-tasks-v106
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture failing node tests
        shell: bash
        run: |
          set +e
          node --test tests/*.test.mjs > /tmp/v106-tests.log 2>&1
          status=$?
          {
            echo "exit_status=$status"
            echo "--- failure excerpts ---"
            grep -n -E 'not ok|AssertionError|failureType:|error:|ERR_ASSERTION|expected|actual' -A8 -B5 /tmp/v106-tests.log || true
            echo "--- tail ---"
            tail -n 180 /tmp/v106-tests.log
          } > tests/v106-regression-output.txt
          sed -i 's/[[:space:]]*$//' tests/v106-regression-output.txt
      - name: Commit diagnostic and remove workflow
        run: |
          rm .github/workflows/v106-regression-diagnostic.yml
          git config user.name "SEVER CI"
          git config user.email "actions@users.noreply.github.com"
          git add tests/v106-regression-output.txt .github/workflows/v106-regression-diagnostic.yml
          git diff --cached --check
          git commit -m "chore(v106): capture regression failure"
          git push origin HEAD:feat/missed-tasks-v106