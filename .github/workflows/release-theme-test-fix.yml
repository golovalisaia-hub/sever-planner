name: Release theme test normalization
on:
  push:
    branches:
      - release/sever-2-v55
permissions:
  contents: write
jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[release-theme-test-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/sever-2-v55
      - name: Normalize excluded theme expectations to Aurora
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/browser/concurrent-db.cjs')
          s = p.read_text()
          replacements = {
              "s.appearance.theme='focus';": "s.appearance.theme='aurora';",
              "assert.equal(s.appearance.theme,'focus')": "assert.equal(s.appearance.theme,'aurora')",
              "s.appearance.theme='cozy';": "s.appearance.theme='aurora';",
              "assert.equal(s.appearance.theme,'cozy')": "assert.equal(s.appearance.theme,'aurora')",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected release-theme test fragment missing: {old}')
              s = s.replace(old, new)
          if "appearance.theme='focus'" in s or "appearance.theme='cozy'" in s or "appearance.theme,'focus'" in s or "appearance.theme,'cozy'" in s:
              raise SystemExit('Legacy theme expectation remains')
          p.write_text(s)
          PY
          git diff --check
      - name: Commit normalized release test
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/browser/concurrent-db.cjs
          git commit -m "test: align release sync checks with Aurora [release-theme-test-fixed]"
          git push origin HEAD:release/sever-2-v55
